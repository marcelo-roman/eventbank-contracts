name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet pack --configuration Release --output artifacts ${version:-}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  publish:
    name: Publish to GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages

      - run: dotnet nuget push "*.nupkg" --source https://nuget.pkg.github.com/marcelo-roman/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
